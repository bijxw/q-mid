<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اختبار مبادئ الإدارة المالية</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#0e1116;color:#e6e9ee;line-height:1.8;display:flex;align-items:center;justify-content:center;padding:20px 14px 60px}
.wrap{width:100%;max-width:720px}
header{text-align:center;margin-bottom:22px}
h1{margin:0;font-size:24px;font-weight:600;color:#e6e9ee}
header p{margin:6px 0 0;color:#8a94a3;font-size:14px}
.box{background:#171c24;border:1px solid #262d38;border-radius:16px;padding:22px;margin-bottom:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
button{font:inherit;color:#e6e9ee;background:#1f2631;border:1px solid #2f3846;border-radius:12px;padding:10px 18px;cursor:pointer;margin:4px 0;transition:.2s}
button:hover{background:#28313f;border-color:#6aa6b8}
#go,#nx,#re{background:#3d7f93;border-color:#3d7f93;color:#fff}
#go:hover,#nx:hover,#re:hover{background:#4a92a8}
.opt{display:block;width:100%;text-align:right;margin:8px 0}
.ok{background:#1d3a30!important;border-color:#5fae8d!important;color:#bfe9d6}
.bad{background:#3a2328!important;border-color:#c07a84!important;color:#f0c4ca}
.exp{background:#1b222c;border-right:4px solid #6aa6b8;border-radius:8px;padding:10px 14px;margin:12px 0;color:#c9d1db}
.bar{height:8px;background:#232a35;border-radius:6px;overflow:hidden;margin-bottom:14px}
.bar div{height:100%;background:#6aa6b8;width:0;transition:.3s}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;color:#8a94a3;font-size:14px;margin-bottom:8px}
select{font:inherit;color:#e6e9ee;background:#1f2631;padding:9px 12px;border:1px solid #2f3846;border-radius:12px;margin:4px 0}
.credit{position:fixed;bottom:12px;left:0;right:0;text-align:center;direction:ltr;font-size:13px;color:#fff;opacity:.28;letter-spacing:.5px;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<header><h1>اختبار مبادئ الإدارة المالية</h1><p>FIN 1201</p></header>
<div id="app"></div>
</div>
<div class="credit">@Hassan.Faisal</div>
<script>
const CH={0:"كل الفصول",1:"الفصل 1: دور وبيئة الإدارة المالية",2:"الفصل 2: الوكالة والحوكمة",3:"الفصل 3: القوائم المالية",4:"الفصل 4: التحليل الرأسي والأفقي",5:"الفصل 5: النسب المالية"};
// [فصل, سؤال, [خيارات], رقم الصحيح, شرح]
const Q=[
[1,"أي مما يلي ليس من القرارات المالية الأساسية؟",["قرار الاستثمار","قرار التمويل","قرار التسويق","قرار توزيع الأرباح"],2,"القرارات الثلاثة: استثمار، تمويل، توزيع أرباح."],
[1,"الإدارة المالية تُعد:",["علمًا فقط","فنًا فقط","علمًا وفنًا","لا علمًا ولا فنًا"],2,"علم لاعتمادها على النظريات والأساليب الكمية، وفن لحاجتها للخبرة والحكم الإداري."],
[1,"الشكل القانوني الذي مسؤولية ملاكه محدودة:",["الشركة الفردية","شركة الأشخاص","شركة الأموال (المساهمة)","كلها"],2,"مسؤولية المساهمين لا تتجاوز ما استثمروه."],
[1,"أي الأشكال القانونية الأكثر شيوعًا؟",["الشركات الفردية","شركات الأشخاص","شركات الأموال","شركات الخدمات"],0,"الفردية الأكثر شيوعًا، والأموال الأضخم."],
[1,"من مهام أمين الخزينة:",["محاسبة التكاليف","إدارة النقدية والعلاقات مع البنوك","التدقيق الداخلي","إعداد جداول الرواتب"],1,"الباقي من مهام المراقب المالي."],
[1,"هدف تعظيم الربح يتجاهل:",["الأرباح","التوقيت والتدفقات النقدية والمخاطرة","المبيعات","التكاليف"],1,"هذه العناصر الثلاثة هي عيوبه."],
[1,"عدم قدرة الشركة مؤقتًا على الوفاء بالتزاماتها رغم أن أصولها تكفي يسمى:",["عسر مالي حقيقي","عسر مالي فني","إفلاس","تصفية"],1,"الفني مؤقت، والحقيقي أصولها لا تكفي."],
[1,"السيولة العالية جدًا عن حاجة الشركة تؤدي إلى:",["زيادة الربحية","انخفاض الربحية","زيادة المخاطر","لا تأثير"],1,"أموال مجمدة لا تولد عائدًا."],
[2,"في الشركات المساهمة، الأصيل هو:",["المديرون","المساهمون","الموردون","العملاء"],1,"المساهمون أصيل، والمديرون وكيل."],
[2,"مشكلة الوكالة هي:",["تعارض المصالح بين الأصيل والوكيل","زيادة الأرباح","نقص السيولة","ارتفاع الضرائب"],0,"تنشأ عندما لا تتطابق أهداف المساهمين والمديرين."],
[2,"من عوامل نشأة مشكلة الوكالة:",["عدم تماثل المعلومات","زيادة المبيعات","انخفاض الضرائب","ارتفاع السيولة"],0,"العوامل: الفصل بين الملكية والسيطرة، تعارض المصالح، عدم تماثل المعلومات."],
[2,"شراء مدير سيارة بـ 800 ألف مع أن 200 ألف تكفي مثال على:",["التوسع غير المبرر","المزايا الإدارية المفرطة","تجنب المخاطر","التركيز على الأجل القصير"],1,"مزايا تتجاوز المنفعة الاقتصادية للشركة."],
[2,"الانخفاض في مصالح المساهمين رغم وجود الرقابة والحوافز يسمى:",["تكاليف الرقابة","تكاليف الالتزام","الخسارة المتبقية","الإفصاح"],2,"أحد أنواع تكاليف الوكالة الثلاثة."],
[2,"أي مما يلي من آليات الحد من مشكلة الوكالة؟",["الحوافز المرتبطة بالأداء","زيادة المصاريف","إخفاء المعلومات","تقليل الرقابة"],0,"الآليات: حوافز، ملكية إدارية، رقابة، مجلس إدارة، إفصاح."],
[2,"الحوكمة الجيدة:",["تضمن أرباحًا دائمة","تمنع الخسائر","تحسن الرقابة والمساءلة دون ضمان نتائج","تلغي المخاطر"],2,"دورها تحسين بيئة القرارات وليس ضمان النتائج."],
[3,"المعادلة المحاسبية:",["الأصول = الالتزامات - الملكية","الأصول = الالتزامات + حقوق الملكية","الأصول = الملكية فقط","الالتزامات = الأصول + الملكية"],1,"جانب الأصول يساوي الالتزامات وحقوق الملكية."],
[3,"الربح التشغيلي (EBIT) = ",["مجمل الربح - المصاريف التشغيلية","المبيعات - الضرائب","صافي الربح + الضرائب","مجمل الربح - الفوائد"],0,"EBIT هو الربح قبل الفوائد والضرائب."],
[3,"الإهلاك مصروف:",["نقدي","غير نقدي","يخرج منه نقد","لا يسجل"],1,"لذلك نضيفه لصافي الربح في التدفقات التشغيلية."],
[3,"الأسهم الممتازة تتميز بـ:",["أرباح غير ثابتة","عوائد ثابتة وأولوية في التوزيع","حق إدارة الشركة","لا أرباح"],1,"تُوزع أرباحها أولًا ثم العادية."],
[3,"في قائمة التدفقات، الزيادة في الذمم المدينة تُعتبر:",["تدفقًا داخلًا","تدفقًا خارجًا","لا تؤثر","نشاطًا تمويليًا"],1,"زيادة أي أصل = نقد خارج."],
[3,"أوراق الدفع تُعامل في التدفقات كنشاط:",["تشغيلي","استثماري","تمويلي","لا شيء"],2,"أوراق الدفع من الأنشطة التمويلية."],
[4,"في التحليل الرأسي لقائمة الدخل ننسب كل بند إلى:",["مجموع الأصول","صافي المبيعات","صافي الربح","حقوق الملكية"],1,"قائمة المركز تنسب للأصول أو للالتزامات والملكية."],
[4,"نسبة التغير في التحليل الأفقي =",["(سنة المقارنة - سنة الأساس) ÷ سنة الأساس","سنة الأساس ÷ سنة المقارنة","سنة المقارنة × 100","الفرق ÷ المبيعات"],0,"ثم × 100."],
[4,"صافي الربح من 301 إلى 462، نسبة التغير:",["10%","20%","53.5%","161%"],2,"161 ÷ 301 × 100."],
[4,"أنسب تحليل لمقارنة شركات مختلفة الحجم:",["الأفقي","الرأسي","كلاهما لا يصلح","التدفقات"],1,"لأنه يحول كل بند إلى نسبة مئوية."],
[4,"عيب التحليل الأفقي:",["لا يظهر الاتجاه","حساس لاختيار سنة الأساس","لا يقارن سنوات","يتجاهل الزمن"],1,"قد يعطي نسب نمو مبالغ فيها."],
[5,"نسبة التداول =",["الأصول المتداولة ÷ الالتزامات المتداولة","النقدية ÷ الأصول","الديون ÷ الأصول","المخزون ÷ المبيعات"],0,"تقيس تغطية الأصول المتداولة للالتزامات المتداولة."],
[5,"النسبة السريعة تستبعد:",["النقدية","الذمم المدينة","المخزون والمصروفات المدفوعة مقدمًا","الأوراق المالية"],2,"لصعوبة تحويلهما إلى نقد."],
[5,"الأصول المتداولة 1004 والالتزامات المتداولة 483، صافي رأس المال العامل:",["521","1487","2.08","483"],0,"1004 - 483 = 521."],
[5,"معدل دوران المخزون =",["المبيعات ÷ المخزون","تكلفة المبيعات ÷ متوسط المخزون","المخزون ÷ تكلفة المبيعات","360 ÷ المخزون"],1,"متوسط فترة التخزين = 360 ÷ معدل الدوران."],
[5,"طول الفترة النقدية =",["التخزين + التحصيل","التخزين + التحصيل - السداد","التحصيل - السداد","التخزين - التحصيل"],1,"أما التشغيلية فهي التخزين + التحصيل."],
[5,"نسبة تغطية الفوائد =",["EBIT ÷ مصاريف الفوائد","الأصول ÷ الفوائد","الربح الصافي ÷ المبيعات","الديون ÷ الملكية"],0,"ارتفاعها إيجابي بعكس باقي نسب المديونية."],
[5,"ربحية السهم (EPS) =",["(صافي الربح - أرباح الممتازة) ÷ عدد الأسهم العادية","الأرباح ÷ المبيعات","السعر ÷ الأرباح","الأرباح الموزعة ÷ السعر"],0,"ارتفاعها إيجابي."],
[5,"ROE = صافي الربح المتاح للعادية ÷ ",["متوسط الأصول","متوسط حقوق المساهمين العاديين","المبيعات","الديون"],1,"2025: 221 ÷ 1687 = 13.1%."],
[5,"القيمة السوقية 40 والدفترية 9.18، نسبة السوقية إلى الدفترية:",["4.35","0.23","9.18","40"],0,"40 ÷ 9.18 = 4.35."]
];
let ch=0,list=[],i=0,score=0,done=false,answered=false;
const app=document.getElementById('app');
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function menu(){
  app.innerHTML='<div class="box"><p><b>اختر الفصل ثم ابدأ.</b><br><span style="color:#8a94a3;font-size:14px">ترتيب الأسئلة والخيارات يتغير كل مرة.</span></p><select id="s">'+Object.keys(CH).map(k=>'<option value="'+k+'">'+CH[k]+'</option>').join('')+'</select> <button id="go">ابدأ الاختبار</button></div>';
  document.getElementById('go').onclick=()=>{ch=+document.getElementById('s').value;start()};
}
function start(){
  list=shuffle(Q.filter(q=>ch==0||q[0]==ch)).map(q=>{const o=q[2].map((t,n)=>({t,ok:n==q[3]}));return {q:q[1],o:shuffle(o),e:q[4]}});
  i=0;score=0;show();
}
function show(){
  if(i>=list.length)return end();
  answered=false;const q=list[i];
  app.innerHTML='<div class="top"><span>السؤال '+(i+1)+' من '+list.length+'</span><span>النتيجة: '+score+'</span></div><div class="bar"><div style="width:'+(i/list.length*100)+'%"></div></div><div class="box"><p><b>'+q.q+'</b></p><div id="o"></div><div id="x"></div></div>';
  const o=document.getElementById('o');
  q.o.forEach(op=>{const b=document.createElement('button');b.className='opt';b.textContent=op.t;b.onclick=()=>pick(b,op);o.appendChild(b)});
}
function pick(b,op){
  if(answered)return;answered=true;const q=list[i];
  if(op.ok){score++;b.classList.add('ok')}else{b.classList.add('bad')}
  [...document.getElementById('o').children].forEach((el,n)=>{if(q.o[n].ok)el.classList.add('ok')});
  document.getElementById('x').innerHTML='<div class="exp">'+(op.ok?'صح! ':'غلط. ')+q.e+'</div><button id="nx">'+(i==list.length-1?'عرض النتيجة':'السؤال التالي')+'</button>';
  document.getElementById('nx').onclick=()=>{i++;show()};
}
function end(){
  const p=Math.round(score/list.length*100);
  app.innerHTML='<div class="box" style="text-align:center"><h2 style="font-weight:600">النتيجة: '+score+' من '+list.length+' ('+p+'%)</h2><p>'+(p>=85?'ممتاز!':p>=60?'جيد، راجع الأسئلة الغلط.':'تحتاج مراجعة أكثر للملخص.')+'</p><button id="re">أعد الاختبار</button> <button id="mn">القائمة</button></div>';
  document.getElementById('re').onclick=start;document.getElementById('mn').onclick=menu;
}
menu();
</script>
</body>
</html>
